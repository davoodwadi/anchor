<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — A: Mind Place</title>
<link rel="stylesheet" href="../shared.css?v=4">
<link rel="stylesheet" href="../app/app.css?v=2">
<style>
  main { display: grid; grid-template-columns: minmax(260px, 360px) minmax(0, 1fr) minmax(300px, 460px); gap: clamp(20px, 3vw, 48px); align-items: start; padding: 1vh clamp(16px, 3vw, 40px) 0; }
  .greet { margin: 8px 0 26px; }
  .greet h1 { font-size: clamp(54px, 5.6vw, 84px); margin-top: 6px; }
  #list .item { flex-wrap: wrap; row-gap: 0; }
  #list .item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stage { border-left: 1px solid rgba(255,255,255,.18); padding: 4px 0 0 clamp(18px, 2.4vw, 36px); max-width: 58ch; }
  .stage h2 { font: 400 clamp(30px, 2.6vw, 40px)/1.05 var(--f-display); color: var(--text); margin: 8px 0 6px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin: 22px 0; }
  .stats div { background: rgba(14,16,15,.85); padding: 14px 16px; }
  .stats b { display: block; font: 400 34px var(--f-display); color: var(--text); line-height: 1; margin-top: 6px; }
  .linkbox { display: flex; gap: 10px; align-items: center; font-family: var(--f-type); font-size: 15px; color: var(--text); background: rgba(10,11,11,.8); border: 1px solid var(--line); padding: 10px 12px; margin: 8px 0 22px; }
  .linkbox span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .linkbox button { margin-left: auto; background: none; border: 0; cursor: pointer; color: var(--text-2); font: 500 14px var(--f-ui); letter-spacing: .1em; text-transform: uppercase; display: inline-flex; gap: 8px; align-items: center; white-space: nowrap; }
  .row-actions { display: flex; flex-wrap: wrap; gap: 14px 28px; }
  .empty { color: var(--text-2); }
  .sheet { transform: rotate(2deg); font-size: clamp(11px, .95vw, 14px); line-height: 2.2; }
  .sheet .o { padding-left: 3.6em; text-indent: -1.6em; margin: 0; }
  .sheet .stamp { position: absolute; right: 9%; bottom: 8%; font-size: 1.6em; transform: rotate(-6deg); text-align: right; }
  @media (max-width: 1180px) { main { grid-template-columns: minmax(240px, 320px) minmax(0, 1fr); } .desk { display: none; } }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } .stage { border-left: 0; padding-left: 0; } .stats b { font-size: 28px; } }
</style>
</head>
<body class="desk-bg">
<div class="shade-l"></div><div class="grain"></div><div class="vignette"></div>
<div class="wrap">
  <header class="bar">
    <span class="wordmark">ANCHOR</span>
    <span class="mid"></span>
    <span class="end"><span class="link" style="text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:15px" id="me"></span><a class="chip" href="#">Sign out</a></span>
  </header>
  <main>
    <section>
      <div class="greet"><div class="kicker" style="font-size:14px;color:var(--text-3)">Your quizzes</div><h1 class="h-display">THE DESK</h1></div>
      <div class="grp"><h3>Quizzes <span id="n"></span></h3><div id="list"></div></div>
      <div class="grp" style="margin-top:18px"><h3>Study</h3><button class="item">Study session<span class="meta">Explain · Practise</span></button></div>
    </section>
    <section class="stage" id="stage"></section>
    <section class="desk" aria-hidden="true"><div class="sheet paper typed" id="sheet"></div></section>
  </main>
  <nav class="actions">
    <a class="primary" href="#"><span class="key">N</span>New quiz</a>
    <a href="#"><span class="key">S</span>Study session</a>
  </nav>
</div>
<script src="../app/data.js"></script>
<script>
document.getElementById("me").textContent = ME.email;
let cur = 0;
function render() {
  document.getElementById("n").textContent = QUIZZES.length;
  document.getElementById("list").innerHTML = QUIZZES.map((q, i) => `
    <button class="item ${i === cur ? "on" : ""}" data-i="${i}"><span class="t">${q.title}</span><span class="meta">${q.attempts || "—"}</span></button>`).join("");
  document.querySelectorAll("#list .item").forEach(b => b.onclick = () => { cur = +b.dataset.i; render(); });
  const q = QUIZZES[cur];
  document.getElementById("stage").innerHTML = `
    <div class="label">Created ${q.created} · ${q.questions} questions</div>
    <h2>${q.title}</h2>
    <div class="stats"><div><span class="label">Attempts</span><b>${q.attempts}</b></div><div><span class="label">Median</span><b>${q.median}</b></div><div><span class="label">Most missed</span><b>${q.attempts ? "Q5" : "—"}</b></div></div>
    <div class="label">Share link</div>
    <div class="linkbox"><span>anchor.app/take/${q.id}</span><button><span class="key">C</span>Copy</button></div>
    ${q.attempts ? "" : '<p class="prose empty">No attempts yet. Share the link in class or on your LMS.</p>'}
    <div class="row-actions actions" style="justify-content:flex-start;padding:6px 0 0">
      <a class="primary" href="../quiz/a-mind-place.html"><span class="key">Enter</span>Open quiz</a>
      <a href="#"><span class="key">P</span>Preview as student</a>
    </div>`;
  const first = QUIZ.questions[0];
  document.getElementById("sheet").innerHTML = `
    <p style="margin:0 0 1.6em;font-weight:700">${q.title.toUpperCase()}</p>
    <p style="margin:0 0 1em">1. ${first.text}</p>
    ${first.options.map((o, i) => `<p class="o">${L[i]}) ${o}</p>`).join("")}
    <span class="hand stamp">${q.attempts ? `${q.attempts} attempts<br>median ${q.median}` : "not shared yet"}</span>`;
}
render();
addEventListener("keydown", e => { const k = e.key.toLowerCase(); if (k === "arrowdown") { cur = Math.min(QUIZZES.length - 1, cur + 1); render(); } if (k === "arrowup") { cur = Math.max(0, cur - 1); render(); } });
</script>
</body>
</html>
