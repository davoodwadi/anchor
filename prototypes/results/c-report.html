<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Results — C: Report</title>
<link rel="stylesheet" href="../shared.css?v=4">
<link rel="stylesheet" href="../app/app.css?v=2">
<style>
  main { max-width: 820px; margin: 0 auto; padding: 4vh 16px 10vh; }
  .card { text-align: center; padding: 6vh 0 7vh; }
  .score { font-size: clamp(120px, 22vw, 260px); line-height: .82; margin: 8px 0 16px; }
  .meta { font: 400 16px var(--f-ui); letter-spacing: .06em; color: var(--text-3); }
  .bar6 { display: flex; justify-content: center; gap: 5px; margin-top: 22px; }
  .bar6 i { width: 40px; height: 6px; background: var(--sage-dim); }
  .bar6 i.no { background: var(--red); }

  h2.sec { font: 500 16px var(--f-ui); letter-spacing: .2em; text-transform: uppercase; color: var(--text-2); margin: 40px 0 14px; display: flex; gap: 12px; align-items: baseline; }
  h2.sec span { color: var(--text-3); letter-spacing: .06em; }

  .miss { border-top: 1px solid var(--line); padding: 24px 0 26px; }
  .miss .n { font: 400 15px var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: #c27a76; }
  .miss .q { font: 400 21px/1.45 var(--f-body); color: var(--text); margin: 8px 0 16px; }
  .ans { display: grid; grid-template-columns: 120px 1fr; gap: 6px 14px; font: 400 17px/1.45 var(--f-body); }
  .ans .k { font: 500 14px var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); padding-top: 3px; }
  .ans .bad { color: #d59591; text-decoration: line-through; text-decoration-color: rgba(213,149,145,.55); }
  .ans .good { color: var(--sage); }
  .why { font: 400 17px/1.65 var(--f-body); color: var(--text-2); margin: 16px 0 14px; }
  .quote {
    font-family: var(--f-type); font-size: 15px; line-height: 1.8; color: var(--ink);
    padding: 14px 18px; background-color: var(--paper-warm);
  }
  .quote .k { display: block; font-size: 12px; letter-spacing: .14em; opacity: .65; }

  details { border-top: 1px solid var(--line); }
  details summary { list-style: none; cursor: pointer; display: flex; gap: 14px; align-items: baseline; padding: 14px 0; font: 400 17px/1.4 var(--f-body); color: var(--text-2); }
  details summary::-webkit-details-marker { display: none; }
  details summary .n { font: 500 15px var(--f-ui); color: var(--sage); letter-spacing: .08em; flex: none; width: 46px; }
  details summary:hover { color: var(--text); }
  details[open] summary { color: var(--text); }
  details .body { padding: 0 0 18px 60px; }

  .end { margin-top: 48px; text-align: center; font: 400 15px var(--f-body); color: var(--text-3); }
  @media (max-width: 560px) { .ans { grid-template-columns: 1fr; gap: 2px; } details .body { padding-left: 0; } }
</style>
</head>
<body class="dark-bg">
<div class="grain"></div><div class="vignette"></div>
<div class="wrap">
  <header class="bar">
    <span class="wordmark">ANCHOR</span>
    <span class="mid kicker" style="font-size:14px"></span>
    <span class="end"><span class="chip" id="sid"></span></span>
  </header>
  <main>
    <section class="card">
      <div class="kicker" id="kick"></div>
      <h1 class="h-display score" id="score"></h1>
      <div class="meta" id="meta"></div>
      <div class="bar6" id="bar6" aria-hidden="true"></div>
    </section>
    <h2 class="sec">What you missed <span id="nm"></span></h2>
    <div id="missed"></div>
    <h2 class="sec">What you got right <span id="nc"></span></h2>
    <div id="right"></div>
    <p class="end">Your instructor sees this attempt on their dashboard.</p>
  </main>
</div>
<script src="../app/data.js"></script>
<script>
const A = MY_ATTEMPT, Qs = QUIZ.questions;
const right = (i) => A.picks[i] === Qs[i].correct;
document.querySelector(".mid").textContent = QUIZ.title;
document.getElementById("sid").textContent = A.student;
document.getElementById("kick").textContent = QUIZ.title;
document.getElementById("score").textContent = `${A.score} / ${A.total}`;
document.getElementById("meta").textContent = `Student ${A.student} · Submitted ${A.when}`;
document.getElementById("bar6").innerHTML = Qs.map((_, i) => `<i class="${right(i) ? "" : "no"}"></i>`).join("");

const quote = (q) => `<div class="quote paper"><span class="k">FROM THE READING</span>“${q.citation}”</div>`;
const miss = Qs.map((q, i) => ({ q, i })).filter(({ i }) => !right(i));
const ok = Qs.map((q, i) => ({ q, i })).filter(({ i }) => right(i));
document.getElementById("nm").textContent = miss.length;
document.getElementById("nc").textContent = ok.length;
document.getElementById("missed").innerHTML = miss.map(({ q, i }) => `
  <article class="miss">
    <div class="n">Question ${i + 1}</div>
    <p class="q">${q.text}</p>
    <div class="ans"><span class="k">Your answer</span><span class="bad">${q.options[A.picks[i]]}</span><span class="k">Correct</span><span class="good">${q.options[q.correct]}</span></div>
    <p class="why">${q.explanation}</p>
    ${quote(q)}
  </article>`).join("") || '<p class="prose">Nothing. Every answer was correct.</p>';
document.getElementById("right").innerHTML = ok.map(({ q, i }) => `
  <details><summary><span class="n">Q${i + 1}</span>${q.text}</summary>
    <div class="body"><div class="ans"><span class="k">Your answer</span><span class="good">${q.options[q.correct]}</span></div><p class="why">${q.explanation}</p>${quote(q)}</div>
  </details>`).join("");
</script>
</body>
</html>
