<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Take — A: Mind Place</title>
<link rel="stylesheet" href="../shared.css?v=3">
<link rel="stylesheet" href="take.css">
<style>
  body {
    background:
      radial-gradient(ellipse 50% 60% at 76% 45%, rgba(214,170,98,.18), transparent 70%),
      radial-gradient(ellipse 90% 80% at 60% 50%, rgba(70,48,28,.5), transparent 75%),
      repeating-linear-gradient(92deg, rgba(0,0,0,.18) 0 2px, transparent 2px 9px, rgba(255,220,170,.025) 9px 10px, transparent 10px 23px),
      linear-gradient(#1b1510, #0d0b09);
    min-height: 100svh;
  }
  .shade { position: fixed; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(8,8,8,.97) 0%, rgba(8,8,8,.9) 34%, rgba(8,8,8,.3) 60%, transparent 78%); }
  #app { position: relative; z-index: 1; }

  .shell { min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; }
  .bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 20px clamp(16px, 3vw, 40px); gap: 12px; }
  .chip { display: inline-flex; gap: 10px; align-items: center; background: rgba(30,32,31,.7); padding: 8px 12px; font-size: 18px; text-transform: uppercase; letter-spacing: .06em; color: var(--text); border: 0; cursor: pointer; font-family: var(--f-ui); }
  .bar .title { text-align: center; }
  .bar .right { justify-self: end; }

  main { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr) minmax(300px, 480px); gap: clamp(20px, 3vw, 48px); align-items: start; padding: 2vh clamp(16px, 3vw, 40px) 0; }

  .qlist h3 { font: 500 17px var(--f-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--text-2); margin: 0 0 8px; display: flex; gap: 14px; }
  .qlist h3 span { letter-spacing: .04em; }
  .qlist button {
    display: flex; gap: 8px; align-items: center; width: 100%; text-align: left;
    background: none; border: 0; padding: 4px 0 4px 16px; position: relative; cursor: pointer;
    font: 500 19px/1.3 var(--f-ui); letter-spacing: .02em; text-transform: uppercase; color: var(--text-2);
  }
  .qlist button:hover, .qlist button.is-active { color: var(--text); }
  .qlist button.is-active::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px; background: var(--text); }
  .qlist .ans { color: var(--text-3); font-size: 15px; margin-left: auto; letter-spacing: .06em; }

  .stage { border-left: 1px solid rgba(255,255,255,.18); padding: 10px 0 0 clamp(18px, 2.4vw, 36px); max-width: 60ch; }
  .stage .label { font: 500 14px var(--f-ui); letter-spacing: .16em; color: var(--text-3); text-transform: uppercase; margin-bottom: 14px; }
  .stage .qtext { font: 400 clamp(21px, 1.8vw, 25px)/1.45 var(--f-body); color: var(--text); margin: 0 0 26px; text-shadow: 0 1px 8px rgba(0,0,0,.8); }
  .opts { display: grid; gap: 4px; }
  .opt {
    display: flex; gap: 14px; align-items: baseline; width: 100%; text-align: left;
    background: none; border: 0; border-bottom: 1px solid transparent; padding: 10px 4px; cursor: pointer;
    font: 400 19px/1.4 var(--f-body); color: var(--text-2); transition: color .15s, background .15s;
  }
  .opt:hover { color: var(--text); background: rgba(255,255,255,.035); }
  .opt.sel { color: var(--text); background: rgba(149,169,157,.10); box-shadow: inset 2px 0 0 var(--sage); }
  .opt .key { flex: none; transform: translateY(-2px); }
  .opt.sel .key { background: var(--sage); color: var(--bg); }

  .hint-btn { margin-top: 22px; display: inline-flex; gap: 10px; align-items: center; background: none; border: 0; cursor: pointer; font: 500 17px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
  .hint-btn:hover { color: var(--text-2); }

  .desk { padding-top: 4px; }
  .sheet { aspect-ratio: 1000 / 1296; width: 100%; background-color: var(--paper-warm); transform: rotate(2deg); padding: 12% 10% 8%; font-size: clamp(11px, .95vw, 14px); line-height: 2.2; overflow: hidden; position: relative; }
  .sheet .n { margin: 0 0 1.4em; }
  .sheet .o { position: relative; padding-left: 3.6em; text-indent: -1.6em; margin: 0; width: fit-content; }
  .sheet .o.circled::after {
    content: ""; position: absolute; left: .9em; right: -.8em; top: -.1em; bottom: -.15em;
    border: 1.7px solid #161412; border-radius: 50%; transform: rotate(-2deg);
    animation: draw .35s ease-out;
  }
  @keyframes draw { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  .sheet .hint { position: absolute; left: 10%; right: 10%; bottom: 9%; font-size: 1.35em; transform: rotate(-2.5deg); opacity: 0; transition: opacity .4s; }
  .sheet .hint.on { opacity: 1; }
  .sheet .folio { position: absolute; right: 9%; bottom: 4%; font-size: .9em; opacity: .6; }

  .actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px 34px; padding: 24px 16px 28px; font-size: 19px; }
  .actions button { display: inline-flex; gap: 10px; align-items: center; background: none; border: 0; cursor: pointer; font: 500 19px var(--f-ui); text-transform: uppercase; letter-spacing: .05em; color: var(--text-2); }
  .actions button:hover:not(:disabled) { color: var(--text); }
  .actions button:disabled { opacity: .35; cursor: default; }
  .actions .submit:not(:disabled) { color: var(--text); }
  .actions .count { color: var(--text-3); font-size: 16px; letter-spacing: .1em; text-transform: uppercase; }

  .fade { animation: fade .35s both; }
  @keyframes fade { from { opacity: 0; transform: translateY(5px); } }

  @media (max-width: 1100px) {
    main { grid-template-columns: minmax(200px, 260px) minmax(0, 1fr); }
    .desk { display: none; }
    .shade { background: rgba(8,8,8,.75); }
  }
  @media (max-width: 720px) {
    .bar { grid-template-columns: auto 1fr; }
    .bar .title { display: none; }
    main { grid-template-columns: 1fr; }
    .qlist { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
    .qlist h3 { display: none; }
    .qlist button { width: auto; padding: 6px 10px; border: 1px solid var(--line); white-space: nowrap; }
    .qlist button.is-active::before { display: none; }
    .qlist button.is-active { border-color: var(--text-2); }
    .qlist .qlabel { display: none; }
    .stage { border-left: 0; padding-left: 0; }
  }
</style>
</head>
<body>
<div class="shade"></div>
<div class="grain"></div>
<div class="vignette"></div>
<div id="app"></div>

<script src="common.js"></script>
<script>
const app = document.getElementById("app");
const Q = QUIZ.questions;
const answers = {};
let cur = 0, hintOn = false, sid = "";
const L = ["a", "b", "c", "d"];

renderIdentity(app, (id) => { sid = id; shell(); });

function shell() {
  app.innerHTML = `
  <div class="shell">
    <header class="bar">
      <div><button class="chip" id="exit"><span class="key">Esc</span>Exit</button></div>
      <div class="title kicker">${QUIZ.title}</div>
      <div class="right"><span class="chip">${sid}</span></div>
    </header>
    <main>
      <nav class="qlist" aria-label="Questions"></nav>
      <section class="stage" aria-live="polite"></section>
      <section class="desk" aria-hidden="true"><div class="sheet paper typed"></div></section>
    </main>
    <nav class="actions">
      <button id="prev"><span class="key">Q</span>Previous</button>
      <button id="next"><span class="key">E</span>Next</button>
      <span class="count"></span>
      <button class="submit" id="submit"><span class="key">Enter</span>Submit</button>
    </nav>
  </div>`;
  app.querySelector("#prev").onclick = () => go(cur - 1);
  app.querySelector("#next").onclick = () => go(cur + 1);
  app.querySelector("#submit").onclick = submit;
  app.querySelector("#exit").onclick = () => location.reload();
  render();
}

function go(i) { if (i >= 0 && i < Q.length) { cur = i; hintOn = false; render(); } }
function pick(o) {
  answers[cur] = o; render(false);
  // Move on after a beat, unless this was the last unanswered one
  if (cur < Q.length - 1) setTimeout(() => answers[cur] === o && go(cur + 1), 450);
}
function done() { return Object.keys(answers).length === Q.length; }

function render(animate = true) {
  const q = Q[cur];
  const answered = Object.keys(answers).length;
  app.querySelector(".qlist").innerHTML = `<h3>Questions <span>${answered}/${Q.length}</span></h3>` +
    Q.map((_, i) => `<button data-i="${i}" class="${i === cur ? "is-active" : ""}"><span class="qlabel">Question</span> ${i + 1}
      ${answers[i] === undefined ? '<span class="unread"></span>' : `<span class="ans">${L[answers[i]].toUpperCase()}</span>`}</button>`).join("");
  app.querySelectorAll(".qlist button").forEach(b => b.onclick = () => go(+b.dataset.i));

  const stage = app.querySelector(".stage");
  stage.innerHTML = `
    <div class="label">Question ${cur + 1} of ${Q.length}</div>
    <p class="qtext">${q.text}</p>
    <div class="opts" role="radiogroup">
      ${q.options.map((o, i) => `<button class="opt ${answers[cur] === i ? "sel" : ""}" role="radio" aria-checked="${answers[cur] === i}" data-o="${i}"><span class="key">${i + 1}</span>${o}</button>`).join("")}
    </div>
    <button class="hint-btn" id="hint"><span class="key">H</span>${hintOn ? "Hide hint" : "Hint"}</button>`;
  stage.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.o));
  stage.querySelector("#hint").onclick = toggleHint;

  const sheet = app.querySelector(".sheet");
  sheet.innerHTML = `
    <p class="n">${cur + 1}. ${q.text}</p>
    ${q.options.map((o, i) => `<p class="o ${answers[cur] === i ? "circled" : ""}">${L[i]}) ${o}</p>`).join("")}
    <div class="hand hint ${hintOn ? "on" : ""}">${q.hint}</div>
    <div class="folio">${cur + 1} / ${Q.length}</div>`;

  if (animate) [stage, sheet].forEach(el => { el.classList.remove("fade"); void el.offsetWidth; el.classList.add("fade"); });
  app.querySelector("#prev").disabled = cur === 0;
  app.querySelector("#next").disabled = cur === Q.length - 1;
  app.querySelector("#submit").disabled = !done();
  app.querySelector(".count").textContent = done() ? "All answered" : `${answered} of ${Q.length} answered`;
}

function toggleHint() { hintOn = !hintOn; render(false); }

function submit() {
  if (!done()) return;
  app.innerHTML = `<section class="done"><div class="kicker">${QUIZ.title}</div><h1>SUBMITTED</h1><p>Results are the next prototype round.</p></section>`;
}

addEventListener("keydown", (e) => {
  if (isTyping(e) || !app.querySelector(".shell")) return;
  const k = e.key.toLowerCase();
  if (["1", "2", "3", "4"].includes(k)) pick(+k - 1);
  else if (k === "e" || e.key === "ArrowRight") go(cur + 1);
  else if (k === "q" || e.key === "ArrowLeft") go(cur - 1);
  else if (k === "h") toggleHint();
  else if (e.key === "Enter") submit();
});
</script>
</body>
</html>
