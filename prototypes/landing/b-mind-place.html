<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anchor — B: Mind Place</title>
<link rel="stylesheet" href="../shared.css?v=3">
<style>
  /* Lamp-lit desk */
  body {
    background:
      radial-gradient(ellipse 55% 60% at 72% 42%, rgba(214,170,98,.20), transparent 70%),
      radial-gradient(ellipse 90% 80% at 60% 50%, rgba(70,48,28,.55), transparent 75%),
      repeating-linear-gradient(92deg, rgba(0,0,0,.18) 0 2px, transparent 2px 9px, rgba(255,220,170,.025) 9px 10px, transparent 10px 23px),
      linear-gradient(#1b1510, #0d0b09);
    min-height: 100svh;
  }
  .shade {
    position: fixed; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(8,8,8,.96) 0%, rgba(8,8,8,.86) 30%, rgba(8,8,8,.25) 58%, transparent 75%);
  }
  .wrap { position: relative; z-index: 1; min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; }

  /* Top bar: like the Mind Place header */
  .bar {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 20px clamp(16px, 3vw, 40px);
  }
  .chip { display: inline-flex; gap: 10px; align-items: center; background: rgba(30,32,31,.7); padding: 8px 12px; font-size: 19px; text-transform: uppercase; letter-spacing: .06em; }
  .tabs { display: flex; gap: 6px; align-items: center; }
  .tab {
    position: relative; width: 46px; height: 44px; display: grid; place-items: center;
    color: var(--text-2); cursor: pointer; background: none; border: 0; padding: 0;
  }
  .tab svg { width: 22px; height: 22px; }
  .tab.is-active { color: var(--text); background: rgba(255,255,255,.06); box-shadow: inset 0 -2px 0 var(--text); }
  .tab .unread { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); }
  .bar .right { justify-self: end; }

  /* Main: list | transcript | page */
  main {
    display: grid; grid-template-columns: minmax(260px, 360px) minmax(0, 1fr) minmax(320px, 520px);
    gap: clamp(20px, 3vw, 48px); align-items: start;
    padding: 2vh clamp(16px, 3vw, 40px) 0;
  }
  .intro .kicker { color: var(--text-3); }
  .intro h1 {
    font-family: var(--f-display); font-weight: 400; color: var(--sage);
    font-size: clamp(54px, 6.4vw, 92px); line-height: .9; margin: 8px 0 18px;
  }
  .intro p { font-family: var(--f-body); color: var(--text-2); font-size: 17px; margin: 0 0 28px; max-width: 34ch; }

  .filter { display: flex; gap: 18px; font-size: 19px; text-transform: uppercase; margin-bottom: 18px; }
  .group { margin-bottom: 18px; }
  .group h3 { font-family: var(--f-ui); font-weight: 500; font-size: 17px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-2); margin: 0 0 6px; display: flex; gap: 14px; }
  .group h3 span { letter-spacing: .04em; }
  .list button {
    display: flex; gap: 8px; align-items: center; width: 100%; text-align: left;
    background: none; border: 0; padding: 4px 0 4px 16px; position: relative;
    font: 500 19px/1.3 var(--f-ui); letter-spacing: .02em; text-transform: uppercase; color: var(--text-2); cursor: pointer;
  }
  .list button:hover { color: var(--text); }
  .list button.is-active { color: var(--text); }
  .list button.is-active::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px; background: var(--text); }

  .transcript {
    border-left: 1px solid rgba(255,255,255,.18);
    padding: 12px 0 0 clamp(18px, 2.4vw, 36px);
    font-family: var(--f-body); font-size: 18px; line-height: 1.65; color: var(--text);
    max-width: 52ch; min-height: 340px;
  }
  .transcript .label { font-family: var(--f-ui); letter-spacing: .16em; font-size: 14px; color: var(--text-3); text-transform: uppercase; margin-bottom: 14px; }
  .transcript p { margin: 0 0 16px; text-shadow: 0 1px 8px rgba(0,0,0,.8); }
  .fade { animation: fade .45s both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }

  /* The page on the desk */
  .desk { position: relative; perspective: 1400px; padding-top: 6px; }
  .sheet {
    aspect-ratio: 1000 / 1296; width: 100%;
    background-color: var(--paper-warm);
    transform: rotate(2.4deg);
    padding: 11% 10% 8%;
    font-size: clamp(11px, 1.02vw, 14.5px); line-height: 2.25;
    overflow: hidden;
  }
  .sheet p { margin: 0; text-indent: 2.6em; }
  .sheet .gap { height: 2.25em; }
  .sheet .ann { position: absolute; transform: rotate(-4deg); font-size: 1.35em; }
  .sheet .q { text-indent: 0; }
  .sheet .note { font-size: 1.35em; line-height: 1.3; margin: .4em 0 1.1em 1.6em; transform: rotate(-2.5deg); transform-origin: left; }
  .sheet .opt { text-indent: 0; padding-left: 2.4em; }
  .circle { position: relative; }
  .circle::after { content: ""; position: absolute; inset: -.15em -.5em; border: 1.6px solid #191714; border-radius: 50%; transform: rotate(-3deg); }
  .tick::before { content: "✓ "; font-family: var(--f-hand); font-size: 1.4em; }
  .cross::before { content: "✗ "; font-family: var(--f-hand); font-size: 1.4em; }

  /* Bottom actions */
  .actions {
    display: flex; flex-wrap: wrap; gap: 14px 36px; justify-content: center;
    padding: 26px 16px 30px; font-size: 20px;
  }
  .actions a { display: inline-flex; gap: 10px; align-items: center; text-transform: uppercase; letter-spacing: .05em; color: var(--text-2); }
  .actions a:hover { color: var(--text); }
  .actions a.primary { color: var(--text); }

  @media (max-width: 1100px) {
    main { grid-template-columns: minmax(240px, 320px) minmax(0, 1fr); }
    .desk { grid-column: 1 / -1; max-width: 520px; justify-self: center; width: 100%; }
    .shade { background: rgba(8,8,8,.7); }
  }
  @media (max-width: 720px) {
    .bar { grid-template-columns: auto 1fr; }
    .tabs { display: none; }
    main { grid-template-columns: 1fr; }
    .transcript { min-height: 0; }
    .sheet { font-size: 11px; }
  }
</style>
</head>
<body>
<div class="shade"></div>
<div class="grain"></div>
<div class="vignette"></div>

<div class="wrap">
  <header class="bar">
    <div><span class="chip"><span class="key">Esc</span>Anchor</span></div>
    <nav class="tabs" aria-label="Steps">
      <button class="tab is-active" data-step="0" title="Source"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg></button>
      <button class="tab" data-step="1" title="Draft"><span class="unread"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg></button>
      <button class="tab" data-step="2" title="Link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>
      <button class="tab" data-step="3" title="Results"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
    </nav>
    <div class="right"><a class="chip" href="#"><span class="key">Tab</span>Sign in</a></div>
  </header>

  <main>
    <section class="intro">
      <div class="kicker">Quizzes from your course material</div>
      <h1>READ IT.<br>THEN PROVE IT.</h1>
      <p>Anchor turns your slides and readings into a quiz, lets you revise it in conversation, and shares it with one link.</p>

      <div class="filter"><span class="menu-item is-active underline-sel">All</span><span class="menu-item">Unread <span class="unread"></span></span></div>
      <div class="group">
        <h3>For instructors <span>3/3</span></h3>
        <div class="list">
          <button data-step="0" class="is-active">The source</button>
          <button data-step="1">The draft <span class="unread"></span></button>
          <button data-step="2">The link</button>
        </div>
      </div>
      <div class="group">
        <h3>For students <span>1/1</span></h3>
        <div class="list">
          <button data-step="3">The results</button>
        </div>
      </div>
    </section>

    <section class="transcript" aria-live="polite"><div id="transcript"></div></section>

    <section class="desk" aria-hidden="true"><div class="sheet paper typed" id="sheet"></div></section>
  </main>

  <nav class="actions" aria-label="Get started">
    <a class="primary" href="#"><span class="key">Enter</span>Create a quiz</a>
    <a href="#"><span class="key">L</span>I have a quiz link</a>
  </nav>
</div>

<script>
const steps = [
  {
    label: "The source",
    text: [
      "Start with what you already teach. Lecture slides, PDFs, assigned readings, your own notes.",
      "Anchor reads them and drafts questions grounded only in those files. Not the open web, and not a textbook you don't use."
    ],
    sheet: `
      <p>Week 7. Memory and encoding.</p><div class="gap"></div>
      <p>Retrieval is not a neutral readout of what was stored. Each act of recall changes the memory, making it more durable and easier to reach again.</p><div class="gap"></div>
      <p>In Roediger and Karpicke's 2006 study, students who were tested on a passage remembered more of it a week later than students who reread it.</p>
      <span class="hand ann" style="right:7%;bottom:9%">→ GOOD QUIZ MATERIAL</span>`
  },
  {
    label: "The draft",
    text: [
      "Anchor writes the first draft. You revise it the way you'd mark up a TA's work: in plain language, in conversation.",
      "Harder distractors. Fewer definitions. One more question on the reading. Keep going until every question is one you'd sign."
    ],
    sheet: `
      <p class="q">3. What is the testing effect?</p>
      <p class="opt">a) <span class="scribble">Studying is better than testing</span></p>
      <p class="opt"><span class="scribble">b) Testing is better than studying</span></p>
      <div class="hand note">↳ TOO EASY. MAKE ALL FOUR PLAUSIBLE.</div>
      <p class="opt">a) Rereading improves recall at all delays</p>
      <p class="opt">b) Retrieval improves long-term retention</p>
      <p class="opt">c) Testing helps only immediately after study</p>
      <p class="opt">d) Spaced reading outperforms testing</p>
      <div class="gap"></div>
      <span class="hand ann" style="right:8%;bottom:12%">✓ ADD 2 ON RETRIEVAL<br>PRACTICE</span>`
  },
  {
    label: "The link",
    text: [
      "Share one link in class or on your LMS. Students don't make accounts. They enter a student number and begin.",
      "Every attempt lands on your dashboard: scores, timing, and the questions the room got wrong."
    ],
    sheet: `
      <p class="q">WEEK 7. RETRIEVAL. 12 QUESTIONS.</p><div class="gap"></div>
      <p class="q">anchor.app/take/7f3c-retrieval</p><div class="gap"></div>
      <p class="q">Attempts ........... 64</p>
      <p class="q">Median ........... 9/12</p>
      <p class="q">Most missed ........ Q5</p>
      <span class="hand ann" style="left:14%;bottom:16%">REVIEW Q5 ON THURSDAY</span>`
  },
  {
    label: "The results",
    text: [
      "Rereading feels like studying. A quiz shows you whether it was.",
      "When you finish, you see each answer you got wrong next to the correct one and the passage it came from."
    ],
    sheet: `
      <p class="q">5. When was the testing advantage largest?</p>
      <p class="opt cross">Two days</p>
      <p class="opt"><span class="circle">One week</span></p>
      <div class="gap"></div>
      <p>"Testing produced better retention after one week than restudying the material." Week 7 reading, p. 4.</p>
      <span class="hand ann" style="right:10%;bottom:12%;font-size:2.2em">9 / 12</span>`
  }
];

const tEl = document.getElementById("transcript");
const sEl = document.getElementById("sheet");
function show(i) {
  const s = steps[i];
  tEl.innerHTML = `<div class="label">${s.label}</div>` + s.text.map(p => `<p>${p}</p>`).join("");
  sEl.innerHTML = s.sheet;
  [tEl, sEl].forEach(el => { el.classList.remove("fade"); void el.offsetWidth; el.classList.add("fade"); });
  document.querySelectorAll("[data-step]").forEach(b => b.classList.toggle("is-active", +b.dataset.step === i));
  document.querySelectorAll(`[data-step="${i}"] .unread`).forEach(d => d.remove());
  cur = i;
}
let cur = 0;
document.querySelectorAll("[data-step]").forEach(b => b.addEventListener("click", () => show(+b.dataset.step)));
addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" || e.key.toLowerCase() === "e") show((cur + 1) % steps.length);
  if (e.key === "ArrowUp" || e.key.toLowerCase() === "q") show((cur + steps.length - 1) % steps.length);
});
show(0);
</script>
</body>
</html>
